# Publishes the website (the web/ folder) to GitHub Pages every time main changes, after the tests pass.
# One-time: in the GitHub repository, Settings → Pages → Source: "GitHub Actions".
name: Publish Velanzo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # each publish gets its own cache version, so every device picks up the new files (the app still shows APP_VERSION)
      - run: |
          sed -i "s/const VERSION = 'velanzo-' + APP_VERSION;/const VERSION = 'velanzo-' + APP_VERSION + '-${GITHUB_SHA::10}';/" web/sw.js
          grep -q "${GITHUB_SHA::10}" web/sw.js
      # The upload gets its own name on each attempt: on a re-run the deploy would otherwise find two "github-pages"
      # uploads and refuse ("Multiple artifacts named github-pages").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages-${{ github.run_attempt }}
      # GitHub sometimes lists a fresh upload a few seconds late ("No artifacts named ... were found"):
      # then wait and try again, up to three times, before giving up.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 90
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
