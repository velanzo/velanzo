<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <title>How Velanzo works: warehouse, shop and owner</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4b5260"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c0262d"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#101828" flood-opacity=".12"/></filter>
    <style>
      .box { fill: #fff; stroke: #cfd4dc; stroke-width: 1.2; filter: url(#sh); }
      .t { font-size: 16px; font-weight: 700; fill: #1b1f27; }
      .s { font-size: 12.5px; fill: #5b6270; }
      .lane { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
      .num { font-size: 13px; font-weight: 700; fill: #fff; }
      .wire { fill: none; stroke: #4b5260; stroke-width: 2; marker-end: url(#ah); }
      .lbl { font-size: 13px; font-weight: 600; fill: #4b5260; }
      .pill { fill: #fff; stroke: #9aa1af; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .tile { fill: #fff; stroke: #e9cf9f; stroke-width: 1.2; }
      .tt { font-size: 13.5px; font-weight: 600; fill: #1b1f27; }
    </style>
  </defs>

  <!-- lanes -->
  <rect x="10" y="10" width="1180" height="190" rx="14" fill="#eceefe"/>
  <text x="30" y="38" class="lane" fill="#3b46c4">WAREHOUSE  ·  warehouse staff</text>
  <rect x="10" y="220" width="1180" height="230" rx="14" fill="#e7f6ec"/>
  <text x="30" y="248" class="lane" fill="#15803d">SHOP  ·  shop staff</text>
  <text x="1170" y="248" text-anchor="end" class="s" style="font-style:italic">The same steps happen at Shop 2, Shop 3 …</text>
  <rect x="10" y="480" width="1180" height="170" rx="14" fill="#fff4e0"/>
  <text x="30" y="508" class="lane" fill="#b45309">OWNER  ·  TRACKER &amp; ACCOUNTS  (the "master shop" — sees every location live)</text>

  <!-- warehouse row -->
  <rect x="30" y="98" width="110" height="46" rx="23" class="pill"/>
  <text x="85" y="126" text-anchor="middle" class="tt">Supplier</text>
  <path d="M140 121H172" class="wire"/>

  <g transform="translate(180 82)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Stock arrived</text><text x="16" y="51" class="s">Stock arrives from the</text><text x="16" y="67" class="s">supplier — enter it</text></g>
  <path d="M360 122H402" class="wire"/>
  <g transform="translate(410 82)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Warehouse stock</text><text x="16" y="51" class="s">Pieces are added</text><text x="16" y="67" class="s">automatically</text></g>
  <path d="M590 122H632" class="wire"/>
  <g transform="translate(640 82)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Barcode labels</text><text x="16" y="51" class="s">Print one label and</text><text x="16" y="67" class="s">stick it on each piece</text></g>
  <path d="M820 122H862" class="wire"/>
  <g transform="translate(870 82)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Send stock</text><text x="16" y="51" class="s">Scan pieces while packing,</text><text x="16" y="67" class="s">print the dispatch note</text></g>

  <!-- warehouse → shop -->
  <path d="M960 162V210H270V282" class="wire"/>
  <rect x="520" y="199" width="230" height="22" rx="11" fill="#fff" stroke="#cfd4dc"/>
  <text x="635" y="215" text-anchor="middle" class="lbl">🚚 On the way (in transit)</text>

  <!-- shop row -->
  <g transform="translate(180 290)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Receive stock</text><text x="16" y="51" class="s">Scan the parcel to check,</text><text x="16" y="67" class="s">then confirm</text></g>
  <path d="M360 330H402" class="wire"/>
  <g transform="translate(410 290)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Scan</text><text x="16" y="51" class="s">Customer's items at</text><text x="16" y="67" class="s">the counter</text></g>
  <path d="M590 330H632" class="wire"/>
  <g transform="translate(640 290)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Sale</text><text x="16" y="51" class="s">Cash / card / online,</text><text x="16" y="67" class="s">discount, change</text></g>
  <path d="M820 330H862" class="wire"/>
  <g transform="translate(870 290)"><rect width="180" height="80" rx="10" class="box"/><text x="16" y="30" class="t">Bill</text><text x="16" y="51" class="s">Printed and given to</text><text x="16" y="67" class="s">the customer</text></g>
  <path d="M1050 330H1072" class="wire"/>
  <rect x="1078" y="307" width="100" height="46" rx="23" class="pill"/>
  <text x="1128" y="335" text-anchor="middle" class="tt">Customer</text>

  <!-- return / exchange loop -->
  <path d="M1128 353V420H500V378" fill="none" stroke="#c0262d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
  <rect x="680" y="409" width="300" height="22" rx="11" fill="#fff" stroke="#f0b9bc"/>
  <text x="830" y="425" text-anchor="middle" class="lbl" fill="#c0262d" style="fill:#c0262d">↩ Return or exchange: tap “Return or exchange”, scan it</text>

  <!-- shop → owner -->
  <path d="M600 438V512" class="wire" stroke-dasharray="3 4"/>
  <text x="614" y="470" class="lbl">Every purchase, dispatch, sale and return is recorded automatically</text>

  <!-- owner tiles -->
  <g transform="translate(62 548)">
    <rect x="0" width="140" height="56" rx="10" class="tile"/><text x="70" y="34" text-anchor="middle" class="tt">Home (live)</text>
    <rect x="156" width="140" height="56" rx="10" class="tile"/><text x="226" y="27" text-anchor="middle" class="tt">Stock at every</text><text x="226" y="45" text-anchor="middle" class="tt">location</text>
    <rect x="312" width="140" height="56" rx="10" class="tile"/><text x="382" y="27" text-anchor="middle" class="tt">Item history</text><text x="382" y="45" text-anchor="middle" class="s">where it moved</text>
    <rect x="468" width="140" height="56" rx="10" class="tile"/><text x="538" y="27" text-anchor="middle" class="tt">Reports</text><text x="538" y="45" text-anchor="middle" class="s">sales &amp; profit</text>
    <rect x="624" width="140" height="56" rx="10" class="tile"/><text x="694" y="27" text-anchor="middle" class="tt">Suppliers</text><text x="694" y="45" text-anchor="middle" class="s">what you owe</text>
    <rect x="780" width="140" height="56" rx="10" class="tile"/><text x="850" y="34" text-anchor="middle" class="tt">Expenses</text>
    <rect x="936" width="140" height="56" rx="10" class="tile"/><text x="1006" y="27" text-anchor="middle" class="tt">Backup</text><text x="1006" y="45" text-anchor="middle" class="s">&amp; Excel export</text>
  </g>

  <!-- step numbers -->
  <g class="nums">
    <circle cx="180" cy="82" r="14" fill="#3b46c4"/><text x="180" y="87" text-anchor="middle" class="num">1</text>
    <circle cx="410" cy="82" r="14" fill="#3b46c4"/><text x="410" y="87" text-anchor="middle" class="num">2</text>
    <circle cx="640" cy="82" r="14" fill="#3b46c4"/><text x="640" y="87" text-anchor="middle" class="num">3</text>
    <circle cx="870" cy="82" r="14" fill="#3b46c4"/><text x="870" y="87" text-anchor="middle" class="num">4</text>
    <circle cx="180" cy="290" r="14" fill="#15803d"/><text x="180" y="295" text-anchor="middle" class="num">5</text>
    <circle cx="410" cy="290" r="14" fill="#15803d"/><text x="410" y="295" text-anchor="middle" class="num">6</text>
    <circle cx="640" cy="290" r="14" fill="#15803d"/><text x="640" y="295" text-anchor="middle" class="num">7</text>
    <circle cx="870" cy="290" r="14" fill="#15803d"/><text x="870" y="295" text-anchor="middle" class="num">8</text>
  </g>
</svg>
